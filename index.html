  <!-- Twitter Card 메타 태그 -->

  <meta name="twitter:title" content="인생관리 - 할일, 루틴, 성찰을 한 곳에서">

  <meta name="twitter:image" content="https://led-with-ai.vercel.app/og.jpg">
  <!-- Sparkles 파비콘 (Lucide, 종이저널 포인트색 #23506B) -->
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2323506B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .963L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z'/><path d='M20 3v4M22 5h-4M4 17v2M5 18H3'/></svg>">
  
  <!-- 파비콘 동적 변경 스크립트 (로컬 개발 환경 감지) -->
  <script>
    (function() {
      const hostname = window.location.hostname;
      const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
      
      if (isLocal) {
        // 로컬 개발 환경: 원형 배경이 있는 파비콘 (그라데이션 버전)
        const faviconLink = document.getElementById('favicon');
        faviconLink.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%235B5FC7'/><stop offset='100%25' style='stop-color:%238B7AB8'/></linearGradient></defs><circle cx='50' cy='50' r='48' fill='url(%23g)'/><g transform='translate(26,26) scale(2)'><path d='M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .963L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M20 3v4M22 5h-4M4 17v2M5 18H3' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></g></svg>";
      }
      // 배포 환경은 기본값(심플 버전) 유지
    })();
  </script>
  
  <meta name="theme-color" content="#F8F4EC">
  <!-- 저장된 테마를 CSS보다 먼저 건다 (깜빡임 방지). 규칙은 src/theme.js와 같아야 한다 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('led-theme');
        if (!/^(paper|warm|white|night|auto)$/.test(t || '')) t = 'paper';
        var d = document.documentElement;
        d.setAttribute('data-theme', t);
        var dark = t === 'night' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) d.classList.add('is-dark');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#1B1815' : t === 'white' ? '#FFFFFF' : t === 'warm' ? '#FBF8F3' : '#F8F4EC');
      } catch (e) {}
    })();
  </script>
  <!-- 페이퍼로지 실물 서브셋(public/fonts). @font-face는 main.css. 첫 화면 글꼴 깜빡임을 줄이려고 미리 받는다 -->
  <link rel="preload" href="/fonts/Paperlogy-5Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Paperlogy-7Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/utilities.css">
  <link rel="stylesheet" href="/src/styles/paper.css">
</head>
<body>
  <div id="app">
    <!-- 라우팅에 따라 동적으로 로드됨 -->
    <div id="loading">로딩 중...</div>
  </div>
  
  <!-- 외부 라이브러리는 번들에 포함(src/vendor.js). main.js가 먼저 불러온다 -->
  <script type="module" src="/src/main.js"></script>
  
  <script>
    // 1. 서비스 워커 강제 제거 (이전 앱 캐시 문제 해결)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          console.log('Unregistering service worker:', registration);
          registration.unregister();
        }
      });
    }
  </script>
</body>
</html>
